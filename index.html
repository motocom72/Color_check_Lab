<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>グレー補正付き Lab色判定アプリ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f2f2f2;
      margin: 0;
      padding: 16px;
    }

    h2 {
      margin-bottom: 12px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    #video {
      width: 100%;
      border-radius: 10px;
      background: #000;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #canvas {
      display: none;
    }

    .info {
      max-width: 480px;
      margin: 16px auto 0;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-align: left;
    }

    .row {
      margin: 8px 0;
      font-size: 15px;
      word-break: break-word;
    }

    .color-samples {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
    }

    .sample {
      text-align: center;
    }

    .box {
      width: 60px;
      height: 60px;
      border: 1px solid #333;
      border-radius: 6px;
      margin: 0 auto 6px;
      background: #ccc;
    }

    .status {
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
    }

    button {
      margin-top: 14px;
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #0078d4;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #106ebe;
    }

    .small {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>グレー補正付き Lab色判定アプリ</h2>

  <div class="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <canvas id="canvas"></canvas>

  <div class="info">
    <div class="row" id="cameraStatus">カメラ起動待機中...</div>
    <div class="row" id="grayValue">基準グレー: -</div>
    <div class="row" id="targetValue">対象RGB(生): -</div>
    <div class="row" id="correctedValue">対象RGB(補正後): -</div>
    <div class="row" id="labValue">L*: -</div>
    <div class="row status" id="judgment">判定: -</div>

    <div class="color-samples">
      <div class="sample">
        <div class="box" id="grayBox"></div>
        <div class="small">基準グレー</div>
      </div>
      <div class="sample">
        <div class="box" id="targetBox"></div>
        <div class="small">補正後対象色</div>
      </div>
    </div>

    <div style="text-align:center;">
      <button id="startBtn">カメラ開始</button>
    </div>
    <p class="small">
      左上の枠に基準グレー、中央の枠に対象物が入るようにしてください。
    </p>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const octx = overlay.getContext("2d");
    const startBtn = document.getElementById("startBtn");

    let timer = null;

    // ROI設定（動画サイズに対する割合）
    function getROIs(w, h) {
      const grayROI = {
        x: Math.floor(w * 0.08),
        y: Math.floor(h * 0.10),
        width: Math.floor(w * 0.18),
        height: Math.floor(h * 0.18)
      };

      const targetROI = {
        x: Math.floor(w * 0.40),
        y: Math.floor(h * 0.40),
        width: Math.floor(w * 0.20),
        height: Math.floor(h * 0.20)
      };

      return { grayROI, targetROI };
    }

    async function startCamera() {
      try {
        document.getElementById("cameraStatus").textContent = "カメラ起動中...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          overlay.width = video.clientWidth;
          overlay.height = video.clientHeight;

          drawOverlay();

          if (timer) clearInterval(timer);
          timer = setInterval(analyzeFrame, 1000);

          document.getElementById("cameraStatus").textContent = "カメラ起動成功";
        };

        window.addEventListener("resize", drawOverlay);
      } catch (err) {
        document.getElementById("cameraStatus").textContent =
          "カメラ起動失敗: " + err.message;
      }
    }

    function drawOverlay() {
      if (!video.videoWidth || !video.videoHeight || !video.clientWidth || !video.clientHeight) return;

      overlay.width = video.clientWidth;
      overlay.height = video.clientHeight;

      octx.clearRect(0, 0, overlay.width, overlay.height);

      const scaleX = overlay.width / video.videoWidth;
      const scaleY = overlay.height / video.videoHeight;

      const { grayROI, targetROI } = getROIs(video.videoWidth, video.videoHeight);

      octx.lineWidth = 3;
      octx.strokeStyle = "lime";
      octx.strokeRect(
        grayROI.x * scaleX,
        grayROI.y * scaleY,
        grayROI.width * scaleX,
        grayROI.height * scaleY
      );

      octx.strokeStyle = "red";
      octx.strokeRect(
        targetROI.x * scaleX,
        targetROI.y * scaleY,
        targetROI.width * scaleX,
        targetROI.height * scaleY
      );

      octx.fillStyle = "lime";
      octx.font = "16px sans-serif";
      octx.fillText("GRAY", grayROI.x * scaleX, grayROI.y * scaleY - 6);

      octx.fillStyle = "red";
      octx.fillText("TARGET", targetROI.x * scaleX, targetROI.y * scaleY - 6);
    }

    function analyzeFrame() {
      if (!video.videoWidth || !video.videoHeight) return;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const { grayROI, targetROI } = getROIs(canvas.width, canvas.height);

      const grayRGB = getAverageRGB(ctx, grayROI);
      const targetRawRGB = getAverageRGB(ctx, targetROI);

      // 基準グレーの理想値
      const grayTarget = [191, 191, 191];

      // チャンネル別補正
      const correctedRGB = applyGrayCorrection(targetRawRGB, grayRGB, grayTarget);

      // L*計算
      const lab = rgbToLab(correctedRGB[0], correctedRGB[1], correctedRGB[2]);

      // 判定
      const result = judgeByL(lab.L);

      // 表示
      document.getElementById("grayValue").textContent =
        `基準グレー: RGB(${grayRGB[0]}, ${grayRGB[1]}, ${grayRGB[2]})`;

      document.getElementById("targetValue").textContent =
        `対象RGB(生): RGB(${targetRawRGB[0]}, ${targetRawRGB[1]}, ${targetRawRGB[2]})`;

      document.getElementById("correctedValue").textContent =
        `対象RGB(補正後): RGB(${correctedRGB[0]}, ${correctedRGB[1]}, ${correctedRGB[2]})`;

      document.getElementById("labValue").textContent =
        `L*: ${lab.L}`;

      document.getElementById("judgment").textContent =
        `判定: ${result}`;

      document.getElementById("grayBox").style.backgroundColor =
        `rgb(${grayRGB[0]}, ${grayRGB[1]}, ${grayRGB[2]})`;

      document.getElementById("targetBox").style.backgroundColor =
        `rgb(${correctedRGB[0]}, ${correctedRGB[1]}, ${correctedRGB[2]})`;

      drawOverlay();
    }

    function getAverageRGB(context, roi) {
      const imageData = context.getImageData(roi.x, roi.y, roi.width, roi.height);
      const data = imageData.data;

      let r = 0, g = 0, b = 0;
      const count = data.length / 4;

      for (let i = 0; i < data.length; i += 4) {
        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
      }

      return [
        Math.round(r / count),
        Math.round(g / count),
        Math.round(b / count)
      ];
    }

    function applyGrayCorrection(targetRGB, grayMeasured, grayReference = [128, 128, 128]) {
      const corrected = [0, 0, 0];

      for (let i = 0; i < 3; i++) {
        const scale = grayReference[i] / Math.max(grayMeasured[i], 1);
        corrected[i] = clamp(Math.round(targetRGB[i] * scale), 0, 255);
      }

      return corrected;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function rgbToLab(r, g, b) {
      function pivotRGB(n) {
        n /= 255;
        return n > 0.04045
          ? Math.pow((n + 0.055) / 1.055, 2.4)
          : n / 12.92;
      }

      let R = pivotRGB(r);
      let G = pivotRGB(g);
      let B = pivotRGB(b);

      let X = R * 0.4124 + G * 0.3576 + B * 0.1805;
      let Y = R * 0.2126 + G * 0.7152 + B * 0.0722;
      let Z = R * 0.0193 + G * 0.1192 + B * 0.9505;

      X /= 0.95047;
      Y /= 1.00000;
      Z /= 1.08883;

      function pivotXYZ(n) {
        return n > 0.008856
          ? Math.pow(n, 1 / 3)
          : (7.787 * n) + (16 / 116);
      }

      let fy = pivotXYZ(Y);
      let L = (116 * fy) - 16;

      return { L: Math.round(L) };
    }

    function judgeByL(L) {
      if (L < 50) return "濃い";
      if (L > 60) return "薄い";
      return "正常";
    }

    startBtn.addEventListener("click", startCamera);
  </script>
</body>
</html>
